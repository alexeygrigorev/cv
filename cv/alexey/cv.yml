# =============================================================================
# Alexey Grigorev — CV (common source of truth)
# Positioning: AI Product Engineer, production AI systems. Renders to a 2-page
# Harvard-format resume.
#
#   Build:  uv run render.py alexey            # -> alexey/cv.html
#   Print:  open alexey/cv.html in Chrome -> Print -> Save as PDF (A4)
#
# THIS is the file to edit. Position-specific variants (e.g. alexey-datadog/)
# are full copies of this file with focused trims — see their TAILORING.md.
# General improvements discovered while tailoring (factual corrections,
# headline, skills, earlier-role details) get traced back HERE, so the next
# position starts from the best version.
#
# Provenance: structure + renderer from
# https://github.com/AI-Shipping-Labs/workshops/tree/main/2026/2026-07-08-ai-cv-pipeline
# (renderer extended only with optional `detail` on experience_earlier entries).
#
# Edit THIS file, then re-render. Keep bullets tight and quantified.
# `variant:` on experience/project entries lets us later filter by target role
# (applied-ai | ai-platform | fde). Entries with no variant show in all.
# =============================================================================

